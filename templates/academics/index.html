{% extends 'base.html' %}
{% block title %}Academics — StudyMate{% endblock %}
{% block content %}
<h1>Academics</h1>
<h2>Subjects</h2>
<ul>
{% for s in subjects %}
<li><a href="{% url 'academics:subject_detail' s.pk %}">{{ s.name }}</a> ({{ s.code }})</li>
{% empty %}
<li>No subjects yet.</li>
{% endfor %}
</ul>
{% endblock %}
