{% extends 'base.html' %}

{% block title %}Choose subjects | StudyMate{% endblock %}

{% block content %}
    <section class="auth-form">
        <h1>Choose your subjects</h1>
        <form method="post">
            {% csrf_token %}
            {% for subject in subjects %}
                <p>
                    <label>
                        <input type="checkbox" name="subjects" value="{{ subject.pk }}"{% if subject.pk in selected_ids %} checked{% endif %}>
                        {{ subject.name }}{% if subject.code %} ({{ subject.code }}){% endif %}
                    </label>
                </p>
            {% empty %}
                <p>No subjects available yet.</p>
            {% endfor %}
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Save selection</button>
                <a href="{% url 'accounts:profile' %}" class="btn btn-ghost">Cancel</a>
            </div>
        </form>
    </section>
{% endblock %}
