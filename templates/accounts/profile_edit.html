{% extends 'base.html' %}

{% block title %}Edit profile | StudyMate{% endblock %}

{% block content %}
    <section class="auth-form">
        <h1>Edit your profile</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Save changes</button>
                <a href="{% url 'accounts:profile' %}" class="btn btn-ghost">Cancel</a>
            </div>
        </form>
    </section>
{% endblock %}
