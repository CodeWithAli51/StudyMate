{% extends 'base.html' %}

{% block title %}{{ heading }} | StudyMate{% endblock %}

{% block content %}
    <section class="auth-form">
        <h1>{{ heading }}</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Save</button>
                <a href="{% url 'planner:task_list' %}" class="btn btn-ghost">Cancel</a>
            </div>
        </form>
    </section>
{% endblock %}
